[project]
name = "pi_temp_humid"
version = "0.1.0"
description = "Pi temperature and humidity helper project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "rerowep" },
]

dependencies = [
  "click>=8.0",
  "pyside6>=6.6",
]

[project.optional-dependencies]
dev = ["poethepoet>=0.38.0", "pytest>=7.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
pi-temp-humid = "pi_temp_humid.cli:main"
pi-temp-humid-gui = "pi_temp_humid.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pi_temp_humid*"]

[tool.poe.tasks]
run = { cmd = "python -m pi_temp_humid.cli read --simulate" }
read = { cmd = "python -m pi_temp_humid.cli read" }
gui = { cmd = "python -m pi_temp_humid.gui" }
gui_sim = { cmd = "python -m pi_temp_humid.gui", env = { PI_TEMP_SIMULATE = "1" } }
tests = { cmd = "pytest" }
lint = { cmd = "ruff check pi_temp_humid tests" }
format = { cmd = "ruff format pi_temp_humid tests" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RET", "SIM", "UP", "W"]

